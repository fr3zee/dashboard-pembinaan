[phases.setup]
nixPkgs = ["nodejs-20", "php83", "composer", "php83Extensions.gd", "php83Extensions.zip"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-gd --ignore-platform-req=ext-zip", "npm ci --prefer-offline --no-audit"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache && php artisan route:cache && php artisan view:cache"]

[start]
cmd = "mkdir -p database && touch database/database.sqlite && php artisan migrate --force && php artisan serve --host 0.0.0.0 --port \$PORT"
